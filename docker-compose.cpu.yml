# CPU-only overlay (no GPU runtime, float32 inference).
# Usage: docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d
services:
  granite-speech-api:
    build:
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cpu
    environment:
      GRANITE_DEVICE: cpu
      GRANITE_DTYPE: float32
