# AMD ROCm overlay — läuft über ROCDXG + /dev/dxg (Adrenalin 26.2.2+ / ROCm 7.2+).
#
# Voraussetzungen (in WSL Ubuntu, NICHT Docker Desktop):
#   sudo apt install -y docker.io docker-compose-v2
#   (und librocdxg installiert, HSA_ENABLE_DXG_DETECTION=1 in .bashrc)
#
# Starten (im WSL-Terminal):
#   docker compose -f docker-compose.yml -f docker-compose.rocm.yml up -d
services:
  granite-speech-api:
    build:
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/rocm6.4
    environment:
      GRANITE_DEVICE: rocm
      HSA_ENABLE_DXG_DETECTION: "1"
    devices:
      - /dev/dxg
    volumes:
      # librocdxg + DXCore libs ins Container weiterreichen
      - /usr/lib/wsl/lib/libdxcore.so:/usr/lib/libdxcore.so:ro
      - /opt/rocm/lib/librocdxg.so:/usr/lib/librocdxg.so:ro
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    ipc: host
